# Place inside an existing HTTPS VirtualHost. Adjust the paths before enabling.
# More-specific aliases must precede the general /people/ alias.
Alias /people/admin/data/ "/var/lib/people-directory/"
Alias /people/data/ "/var/lib/people-directory/"
Alias /people/ "/opt/people-directory/"

<Directory "/opt/people-directory">
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all granted
</Directory>

<Directory "/var/lib/people-directory">
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all granted
</Directory>

<Location "/people/data/">
    <LimitExcept GET HEAD>
        Require all denied
    </LimitExcept>
</Location>

<Location "/people/admin/">
    AuthType Basic
    AuthName "People Directory Admin"
    AuthUserFile /etc/apache2/people-directory.htpasswd
    Require valid-user
</Location>

<Location "/people/admin/data/">
    Dav On
    AuthType Basic
    AuthName "People Directory Admin"
    AuthUserFile /etc/apache2/people-directory.htpasswd
    Require valid-user
    LimitRequestBody 33554432
    <LimitExcept GET HEAD OPTIONS PUT LOCK UNLOCK>
        Require all denied
    </LimitExcept>
</Location>

<LocationMatch "^/people/(?:admin/)?data/(?!directory\.json$)">
    Require all denied
</LocationMatch>
